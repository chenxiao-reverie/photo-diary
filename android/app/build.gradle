plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shenxiao.photodiary'
    compileSdk 34

    defaultConfig {
        applicationId "com.shenxiao.photodiary"
        minSdk 29        // Android 10+：相册 RELATIVE_PATH 需要 API 29；覆盖约 94% 在役设备
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
